name: Deploy to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== 构建前端 =====
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # ===== 部署到 VPS =====
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy frontend (dist)
        run: |
          rsync -rlgoDzvc --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/opt/rustpbx-community/frontend/dist/

      - name: Deploy backend code
        run: |
          rsync -rlgoDzvc --delete \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='.git/' \
            --exclude='*.pyc' \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key" \
            backend/ \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:/opt/rustpbx-community/backend/

      - name: Install backend dependencies & restart service
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key \
            ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} << 'EOF'
            cd /opt/rustpbx-community/backend
            source .venv/bin/activate
            pip install -r requirements.txt -q
            sudo systemctl restart rustpbx-api
            sudo systemctl reload nginx
            echo "Deploy completed at $(date)"
          EOF
