services:
  # ===== MySQL 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: rustpbx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret_123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-rustpbx_community}
      MYSQL_USER: ${MYSQL_USER:-rustpbx}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rustpbx_secret_123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 后端 FastAPI =====
  backend:
    build: ./backend
    container_name: rustpbx-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    depends_on:
      mysql:
        condition: service_healthy

  # ===== 前端 React (nginx) =====
  frontend:
    build: ./frontend
    container_name: rustpbx-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
